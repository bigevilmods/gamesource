/* This function is used for opening links to files from an HTML Help .CHM file.	*/
/* Such links fail to open otherwise.  i.e. <a href="dave_8.fsh"> fails.			*/
/* Usage:																			*/
/*		<a onclick="openfile('dave_8.fsh')"											*/
/*		style="text-decoration: none; color:#003399; cursor: hand">					*/
/* The link style is required, otherwise it will not look like a link.				*/

function mailtosupport()
{
//    var recipient = "eaglsupport@ea.com";
    var recipient = "audreys@ea.com";
    var subject = "$projectname Support Request";
		var end = location.href.lastIndexOf("/") + 1;
		if (end < 0)
		    end = location.href.lastIndexOf("\\") + 1;
    var pagepath = location.href;
    var page = pagepath.substr(end);
    var webpage = "http://tools.eac.ea.com/eagl/release/pc/" + page;
    var body =    "Referencing document:  $projectname $projectnumber, " + page + "%0A";
    body = body + "Web reference:         " + webpage + "%0A%0A";
    body = body + "Platform I am using:   %0A";
    body = body + "My issue or question:%0A%0A";
    alert(body);
    location.href = "mailto:" + recipient + "?subject=" + subject + "&body=" + body;
}
