function mailtosupport()
{
    var recipient = "ignitionsupport@ea.com";
    var subject = "eacore_locale Support Request";
		var end = location.href.lastIndexOf("/") + 1;
		if (end < 0)
		    end = location.href.lastIndexOf("\\") + 1;
    var pagepath = location.href;
    var page = pagepath.substr(end);
    var webpage = "http://ignition.ea.com/path/release/" + page;
    var body =    "Referencing document:  eacore_locale 1.00.01, " + page + "%0A";
    body = body + "Platform I am using:   %0A";
    body = body + "My issue or question:%0A%0A";
    location.href = "mailto:" + recipient + "?subject=" + subject + "&body=" + body;
}

function checkframeset()
{
	/* if not a CHM file, and this doc is not part of frameset, then load frameset */
	if (location.href.search("ms-its:")!=0 && location.href.search("mk:")!=0 && location.href.search("file:")!=0 && top.frames.length<1)
	{
		var re = new RegExp("http:.*/(\\w*.html)","g");
		var r = re.exec(location.href);
		if (r[1].length>0);
			location.href = "index.htm?right="+r[1];
	}
}

function openlocalfile(fn)
{
	var link;
	
	if (location.href.indexOf("file:")==0)
	{
		link = fn;
	}
	else if (location.href.indexOf("http:")==0)
	{
		var Y;
		
		Y = location.href.lastIndexOf("/") + 1;
		link = location.href.substring(0, Y) + fn;
	}
	else
	{
		var X, Y, sl, a, ra;

		ra = /:/;
		a = location.href.search(ra);
		if (a == 2)
			X = 14;
		else
			X = 7;
		sl = "\\";
		Y = location.href.lastIndexOf(sl) + 1;
		link = 'file:///' + location.href.substring(X, Y) + fn;
	}
    location.href = link;
}
